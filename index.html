<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mega Remote">
<meta name="theme-color" content="#120f24">
<title>Mega Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a5cff'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%237a5cff'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#120f24;--card:#1b1633;--line:#2b2450;--txt:#ece9ff;--dim:#9c95c4;--ok:#5ad68a;--warn:#ffb547;--bad:#ff6b6b;--gold:#ffd45e;--acc:#7a5cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 24px)}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  header .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#5b3fd6,#c79a2b);display:grid;place-items:center;font-weight:900}
  header .t{flex:1}header .t b{font-size:18px;display:block}header .t span{font-size:13px;color:var(--dim)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .tabs button{all:unset;text-align:center;padding:10px 2px;border-radius:12px;background:#1f1a38;color:#b7b1d6;font-weight:700;font-size:15px}
  .tabs button.on{background:linear-gradient(90deg,#5b3fd6,#7a5cff);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  h3{margin:0 0 8px;font-size:17px}
  .dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
  .row .k{color:var(--dim);flex:none}.row .v{text-align:right}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;font:700 16px/1.2 inherit;color:#fff;background:#2c2552}
  .btn.gold{background:linear-gradient(90deg,#7a5cff,#c79a2b)}.btn.danger{background:#5a1f2a}.btn:disabled{opacity:.45}
  .btn.sm{padding:10px 6px;font-size:14px;margin-top:0}
  .tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .bar{height:8px;background:#2a2450;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ad68a,#7a5cff)}
  .flex{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
  img.sp{image-rendering:pixelated;background:#16122b;border-radius:12px;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .mon{background:#16122b;border:1px solid #2e2752;border-radius:12px;padding:6px 4px;text-align:center;font-size:13px}.mon img{width:60px;height:60px;image-rendering:pixelated;display:block;margin:0 auto}
  .mon.now{border-color:var(--ok)}
  select,input[type=text],input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#16122b;color:var(--txt);font:16px inherit;margin-top:8px}
  label.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:16px}label.chk input{width:22px;height:22px}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:#2c2552;border:1px solid var(--acc);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:0 8px 30px #000a;transition:opacity .3s}
  .lbl{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--dim)}
  .big{font-size:22px;font-weight:800}
  .zbtn{border:0;border-radius:10px;background:#2c2552;color:#fff;font:800 15px inherit;padding:8px 10px}
  .seg{display:grid;gap:6px;margin-bottom:12px}.seg button{margin:0}
  .pips span{display:inline-block;width:20px;height:8px;border-radius:4px;margin-right:3px;background:#2e2752}.pips .w{background:#5ad68a}.pips .n{background:#ffd45e}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;background:#2c2552}
</style>
</head>
<body>
<header><div class="logo">M</div><div class="t"><b>Mega Remote</b><span id="sub">connecting…</span></div><button class="zbtn" data-x="refresh" title="Ask your PC for an update now">⟳</button><button class="zbtn" data-z="-1">A−</button><button class="zbtn" data-z="1">A+</button></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="toast" id="toast" style="opacity:0;pointer-events:none"></div>
<script>
'use strict';
// ---- pairing (the link from Mega's "Send Setup Link to My Phone" alert) ----
const SPRITE = (id) => `https://pokecatch-online.pages.dev/assets/pokemon/${id}.png`;
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// The pairing lives in the address (#pair-…) as well as in this browser's storage: on iPhone the
// ntfy alert's browser, Safari and a Home Screen icon each have their own storage, so a bookmark or
// Home Screen icon made from this page keeps working wherever it's opened. (The part after # never
// leaves the phone: browsers don't send it to the server.)
if (location.hash.startsWith('#pair-')) {
  try { const p = JSON.parse(new TextDecoder().decode(unb64u(location.hash.slice(6)))); if (p.s && p.c && p.k) store.set('mr-pair', p); } catch {}
}
let pair = store.get('mr-pair', null);
// text size (A− / A+), remembered on this phone
const ZOOMS = [0.85, 0.95, 1, 1.1, 1.2, 1.35];
let zoomI = store.get('mr-zoom', 2);
const applyZoom = () => { document.body.style.zoom = ZOOMS[zoomI]; };
const pairHash = () => '#pair-' + b64u(new TextEncoder().encode(JSON.stringify({ s: pair.s, c: pair.c, k: pair.k, ...(pair.a ? { a: pair.a } : {}) })));
if (pair && location.hash !== pairHash()) history.replaceState(null, '', location.pathname + pairHash());
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s) => document.querySelector(s);

// ---- crypto: same as Mega (AES-GCM over gzip(JSON)) ----
let ck = null;
async function key() { if (!ck) ck = await crypto.subtle.importKey('raw', unb64u(pair.k), 'AES-GCM', false, ['encrypt', 'decrypt']); return ck; }
async function gz(bytes, mode) { const s = new Blob([bytes]).stream().pipeThrough(mode === 'c' ? new CompressionStream('gzip') : new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function seal(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(), await gz(new TextEncoder().encode(JSON.stringify(obj)), 'c')); const all = new Uint8Array(12 + ct.byteLength); all.set(iv); all.set(new Uint8Array(ct), 12); return b64u(all); }
async function open(text) { const all = unb64u(text); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, await key(), all.slice(12)); return JSON.parse(new TextDecoder().decode(await gz(new Uint8Array(pt), 'd'))); }
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

// ---- status stream ----
let snap = store.get('mr-snap', null), parts = new Map(), es = null;
// Two relays: Ably (free, frequent - when the PC has an Ably key, it comes in the pairing as "a")
// or ntfy.sh. Either way messages are sealed with the pairing key.
const ABLY = 'https://main.realtime.ably.net';
function listen() {
  if (!pair) return;
  try { es?.close(); } catch {}
  if (pair.a) {
    es = new EventSource(`${ABLY}/event-stream?channels=${encodeURIComponent('[?rewind=1]' + pair.s)}&v=1.2&key=${encodeURIComponent(pair.a)}`);
    es.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch { return; } onPart(String(m.data || '')); };
  } else {
    es = new EventSource(`https://ntfy.sh/${pair.s}/sse?since=10m`);
    es.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch { return; } if (m.event === 'message') onPart(String(m.message || '')); };
  }
  es.onerror = () => setSub();
}
async function onPart(text) {
  {
    const [tag, id, pos, body] = text.split('|'); if (tag !== 'M1' || !body) return;
    const [i, n] = pos.split('/').map(Number); const p = parts.get(id) || []; p[i - 1] = body; parts.set(id, p);
    if (p.filter(Boolean).length < n) return; parts.delete(id);
    try { const s = await open(p.join('')); if (!snap || s.at >= snap.at) { snap = s; store.set('mr-snap', s); onSnap(); } } catch {}
  }
}
// "I'm open": the PC sends live updates (about one a minute) only while this app is open, to stay
// inside ntfy's free daily limit. Sent on open, every 2 minutes while visible, and by Refresh.
let lastWatch = 0;
function watchNow(force) { if (!pair || document.hidden) return; if (!force && Date.now() - lastWatch < (pair.a ? 55000 : 115000)) return; lastWatch = Date.now(); cmd('watch', {}, '', null, true); }
setInterval(() => watchNow(false), 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { listen(); watchNow(true); render(); } });

// ---- commands ----
const pending = new Map(); // id -> {label, at, cb}
async function cmd(name, args = {}, label = '', cb = null, quiet = false) {
  if (!pair) return;
  const id = rid();
  if (!quiet) { pending.set(id, { label: label || name, at: Date.now(), cb }); toast(`Sending: ${label || name}…`); }
  try {
    const body = await seal({ id, ts: Date.now(), cmd: name, args });
    const size = pair.a ? 50000 : 3000, n = Math.ceil(body.length / size), mid = rid().slice(0, 6);
    for (let i = 0; i < n; i++) {
      const msg = `M1|${mid}|${i + 1}/${n}|${body.slice(i * size, (i + 1) * size)}`;
      const r = pair.a
        ? await fetch(`${ABLY}/channels/${encodeURIComponent(pair.c)}/messages`, { method: 'POST', headers: { Authorization: 'Basic ' + btoa(pair.a), 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'm', data: msg }) })
        : await fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({ topic: pair.c, message: msg, priority: 1 }) });
      if (!r.ok) throw new Error(r.status === 429 ? 'too many messages today - try again later' : 'relay said ' + r.status);
    }
    if (!quiet) toast(`Sent: ${label || name} - waiting for your PC…`);
  } catch (e) { if (!quiet) toast('Could not send: ' + e.message); pending.delete(id); }
  return id;
}
function onSnap() {
  for (const [id, res] of snap.acks || []) {
    const p = pending.get(id); if (!p) continue;
    pending.delete(id);
    toast(`${/^error/.test(res) ? '⚠' : '✓'} ${p.label}: ${res}`);
    p.cb?.(res, snap.re?.[id]?.data);
  }
  // replies that arrive later (a sim finishing)
  for (const [id, w] of watch) { const r = snap.re?.[id]; if (r && w(r.data)) watch.delete(id); }
  render();
}
const watch = new Map();
for (const [id, p] of pending) if (Date.now() - p.at > 120000) pending.delete(id);
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => (el.style.opacity = 0), 4500); }

// ---- views ----
const TABS = [['now', 'Now'], ['plan', 'Plan'], ['dex', 'Pokédex'], ['sim', 'Simulate'], ['trades', 'Trades'], ['gems', 'Gems'], ['set', 'Settings']];
let tab = store.get('mr-tab', 'now');
const ui = { simMode: store.get('mr-sm', 'legendary'), elite: null, league: null, eliteRes: {}, items: null, dex: null, dexInfo: null, dexQ: '', dexHits: null, sims: null, simPick: null, simRes: {}, asMax: false, addType: 'legend', addVal: '' };
function setSub() {
  const el = $('#sub'); if (!pair) { el.textContent = 'not paired'; return; }
  if (!snap) { el.textContent = 'waiting for your PC…'; return; }
  const s = Math.round((Date.now() - snap.at) / 1000);
  el.innerHTML = s < (pair.a ? 60 : 150) ? `<span class="ok">● live${pair.a ? '' : ' (slow relay)'}</span> · updated ${s < 10 ? 'just now' : s + ' s ago'}` : `<span class="warn">● last update ${s < 3600 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'} ago</span> · tap ⟳`;
}
setInterval(setSub, 5000);
const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const bar = (p) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, p * 100)).toFixed(1)}%"></i></div>`;
const img = (id, n = 52) => `<img class="sp" src="${SPRITE(id)}" width="${n}" height="${n}" loading="lazy">`;
const ICON = { under: '⛏️', region: '📘', candy: '🍬', tower: '🗼', raid: '✨', money: '💰', souls: '👻', loot: '🎁', breed: '🥚', level: '⬆️', elite: '🏆', league: '🎖️', wboss: '🌍' };
const N = (id) => esc(snap?.nm?.[id] || '#' + id);
const pic = (g, n = 48) => (g.sp ? img(g.sp, n) : `<span style="width:${n}px;text-align:center;font-size:${Math.round(n * .55)}px;flex:none">${ICON[g.t] || '🎯'}</span>`);
const progTxt = (p) => (p ? `${p[3] ? '₽' : ''}${(+p[0]).toLocaleString()} of ${p[3] ? '₽' : ''}${(+p[1]).toLocaleString()}${p[2] ? ' ' + esc(p[2]) : ''}` : '');
const at = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function vNow() {
  const s = snap; let h = '';
  h += `<div class="card"><div class="flex"><span style="font-size:26px">${s.run ? '🟢' : '⏸️'}</span><div class="grow"><b style="font-size:18px">${s.run ? 'Plan running' : 'Plan paused'}</b><div class="dim">${s.goals.length} goal${s.goals.length === 1 ? '' : 's'} left · Mega ${esc(s.ver)}</div></div></div>
    <button class="btn ${s.run ? '' : 'gold'}" data-c="plan.run" data-a='{"on":${!s.run}}' data-l="${s.run ? 'Pause plan' : 'Start plan'}">${s.run ? '❚❚ Pause Plan' : '▶ Start Plan'}</button></div>`;
  const probs = []; if (s.old) probs.push('Alakazam 4.x is switched on, so the plan can\'t act.');
  for (const g of s.goals) if (/error|could not|refused|3 times|did not|stuck|too strong/i.test(g.y + ' ' + g.n)) probs.push(`${esc(g.l)}: ${esc(g.y || g.n)}`);
  if ((s.gemPick || []).length) probs.push(`Pick your Legendary gem in the game: Elite League ${s.gemPick.map(([r, t]) => `${esc(r)} tier ${t}`).join(', ')} (needs the PC).`);
  if (probs.length) h += `<div class="card" style="border-color:#c0392b"><h3>⚠️ Needs You</h3>${probs.map((p) => `<div class="warn">${p}</div>`).join('')}</div>`;
  const scr = s.goals.find((g) => !g.bg && g.s === 'running');
  h += `<div class="card"><h3>Today</h3><div class="lbl">WORKING ON NOW${!scr && s.idle ? ' · IDLE' : ''}</div>`;
  if (scr) h += `<div class="flex" style="margin-top:6px">${pic(scr, 60)}<div class="grow"><b style="font-size:17px">${esc(scr.l)}</b>${scr.p ? `<div class="big">${progTxt(scr.p)}</div>` : ''}</div></div>${scr.p ? bar(scr.p[0] / scr.p[1]) : ''}${scr.n ? `<div style="margin-top:8px">${esc(scr.n)}</div>` : ''}`;
  else if (s.idle) h += `<div class="flex" style="margin-top:6px">${s.idle.u[0] ? img(s.idle.u[0][0], 60) : '<span style="font-size:34px">💤</span>'}<div class="grow"><b style="font-size:17px">${s.idle.u.length ? 'Leveling while every goal waits' : 'Parked - nothing to level'}</b><div>${s.idle.u.map((m) => `${N(m[0])}${m[3] ? ' ✨' : ''}${m[2] ? ' ★' + m[2] : ''} <b>Lv ${m[1]}</b>`).join(' · ')}</div></div></div><div class="dim" style="margin-top:6px">${esc(s.idle.l)}</div>`;
  else h += `<div style="margin-top:6px">${s.run ? 'Nothing can run right this minute.' : 'Nothing - the plan is paused.'}</div>`;
  if (s.where) h += `<div class="dim" style="margin-top:6px">📍 ${esc(s.where)}${s.foes.length ? ' · fighting ' + esc(s.foes.join(', ')) : ''}</div>`;
  h += `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:4px">${s.today.map(([k, v]) => row(esc(k), esc(v))).join('')}</div></div>`;
  const bg = s.goals.filter((g) => g.bg && g.s !== 'paused');
  if (bg.length) h += `<div class="card"><h3>Running Alongside</h3>${bg.map((g) => `<div class="flex" style="margin:8px 0">${pic(g, 40)}<div class="grow"><b>${esc(g.l)}</b>${g.p ? ` <span class="dim">· ${progTxt(g.p)}</span>` : ''}<div class="dim">${esc(g.n || g.y)}</div></div></div>`).join('')}</div>`;
  const next = s.goals.filter((g) => g !== scr && !g.bg && !(g.s === 'wait' && /\b(locked|closed)\b/i.test(g.y)));
  if (next.length) h += `<div class="card"><h3>Up Next</h3>${next.slice(0, 5).map((g) => `<div class="flex" style="margin:8px 0">${pic(g, 40)}<div class="grow"><b>${esc(g.l)}</b>${g.p ? ` <span class="dim">· ${progTxt(g.p)}</span>` : ''}<div class="dim">${g.s === 'paused' ? '❚❚ paused' : g.s === 'queued' ? '○ after the one above' : '◐ ' + esc(g.y || g.s)}</div></div></div>`).join('')}</div>`;
  if (s.trades) { const sp = s.trades.t.filter((t) => t[6] === 'spare'); h += `<div class="card"><h3>Trades</h3>${s.trades.t.length ? `${s.trades.t.length} Pokémon you're missing are on the board${sp.length ? ` · <span class="ok">${sp.length} for a spare</span>` : ' · none for a spare right now'}` : 'Nothing you\'re missing on the board.'}</div>`; }
  if (s.dex.length) h += `<div class="card"><h3>Pokédex</h3>${s.dex.map(([n, a, b]) => `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><b>${esc(n)}</b><span>${a} / ${b}${a >= b ? ' <span class="ok">✔</span>' : ''}</span></div>${bar(a / Math.max(1, b))}</div>`).join('')}</div>`;
  if (s.team.length) h += `<div class="card"><h3>Team</h3><div style="display:grid;grid-template-columns:repeat(${Math.min(6, s.team.length)},1fr);text-align:center;gap:4px">${s.team.map(([id, lv, r, sh, b]) => `<div>${img(id, 48)}<div style="font-size:12px">${N(id)}</div><div class="dim" style="font-size:12px">Lv ${lv}${r ? ' ★' + r : ''}${sh ? ' ✨' : ''}${b ? ' 💛' : ''}</div></div>`).join('')}</div></div>`;
  return h;
}
function vPlan() {
  const s = snap; let h = `<div class="card"><button class="btn ${s.run ? '' : 'gold'}" style="margin:0" data-c="plan.run" data-a='{"on":${!s.run}}' data-l="${s.run ? 'Pause plan' : 'Start plan'}">${s.run ? '❚❚ Pause Plan' : '▶ Start Plan'}</button><div class="dim" style="margin-top:8px">${esc(s.top)}</div></div>`;
  h += addCard(s);
  const W = { running: ['ok', '●', 'running'], ready: ['ok', '●', 'running'], queued: ['dim', '○', 'next'], wait: ['warn', '◐', 'waiting'], paused: ['dim', '❚❚', 'paused'] };
  s.goals.forEach((g, i) => {
    const [cls, dot, word] = W[g.s] || W.wait;
    h += `<div class="card"><div class="flex"><b class="dim" style="width:20px">${i + 1}</b>${pic(g, 44)}<div class="grow"><b>${esc(g.l)}</b>${g.p ? `<div class="dim">${progTxt(g.p)}</div>` : ''}</div></div>
      <div class="${cls}" style="margin-top:6px">${dot} ${word}${g.y ? ' · ' + esc(g.y) : ''}${g.s === 'running' && g.n ? ' · ' + esc(g.n) : ''}</div>
      <div class="tools">
        <button class="btn sm" data-c="goal.top" data-a='{"id":"${g.id}"}' data-l="Move to top" ${i ? '' : 'disabled'}>⤒ Top</button>
        <button class="btn sm" data-c="goal.up" data-a='{"id":"${g.id}"}' data-l="Move up" ${i ? '' : 'disabled'}>↑ Up</button>
        <button class="btn sm" data-c="goal.down" data-a='{"id":"${g.id}"}' data-l="Move down" ${i < s.goals.length - 1 ? '' : 'disabled'}>↓ Down</button>

    const rq = await cmd('sim.run', { id, asMax: ui.asMax }, 'Run simulator');
    watch.set(rq, (d) => { if (d && !d.running) { ui.simRes[id] = d; loadSims(); render(); return true; } return false; });
  }
  if (x === 'addGoal') {
    const ty = ui.addType, v = ui.addVal;
    const args = ty === 'legend' ? { type: ty, foe: +v } : ty === 'money' ? { type: ty, target: +v || 1e7 } : ty === 'region' ? { type: ty, reg: v } : { type: ty };
    if ((ty === 'legend' || ty === 'region') && !v) { toast('Choose one first'); return; }
    cmd('goal.add', args, 'Add goal', () => { ui.addVal = ''; if (ty === 'legend') loadSims(); });
  }
  if (x === 'unpair') { if (await askConfirm('Unpair this phone? You can pair again from Mega\'s Settings.')) { localStorage.clear(); pair = null; snap = null; history.replaceState(null, '', location.pathname); try { es?.close(); } catch {} render(); } }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'addType') { ui.addType = t.value; ui.addVal = ''; if (t.value === 'legend' && !ui.sims) loadSims(); if (t.value === 'item' && !ui.items) loadItems(); render(); }
  if (t.id === 'addVal' && ui.addType === 'item') { ui.addVal = t.value; render(); return; }
  if (t.id === 'addVal') ui.addVal = t.value;
  if (t.id === 'simPick') { ui.simPick = +t.value || null; render(); }
  if (t.id === 'asMax') ui.asMax = t.checked;
  if (t.dataset.set) cmd(t.dataset.set, { on: t.checked }, t.checked ? 'Turn on' : 'Turn off');
});
let qT = null;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'dexQ') return;
  ui.dexQ = e.target.value.trim(); ui.dexHits = null; clearTimeout(qT);
  if (ui.dexQ.length < 2) { render(); return; }
  qT = setTimeout(() => cmd('dex.search', { q: ui.dexQ }, 'Search', (r, data) => { ui.dexHits = data || []; render(); }), 700);
});
function openDex(id) { cmd('dex.info', { id }, 'Look up', (r, data) => { if (data) { ui.dexInfo = data; window.scrollTo(0, 0); render(); } }); }
function loadElite() { cmd('elite.list', {}, 'Load elite legendaries', (r, data) => { ui.elite = data || []; render(); }); }
function loadLeague() { cmd('league.list', {}, 'Load Elite League', (r, data) => { ui.league = data || []; render(); }); }
function loadItems() { cmd('item.list', {}, 'Load rare items', (r, data) => { ui.items = data || []; render(); }); }
function loadSims() { cmd('sim.list', {}, 'Load legendaries', (r, data) => { ui.sims = data || []; render(); }); }
function askConfirm(text) {
  return new Promise((res) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:20px';
    d.innerHTML = `<div class="card" style="max-width:420px;width:100%"><div style="font-size:17px">${esc(text)}</div><button class="btn danger" data-ok>Yes</button><button class="btn" data-no>Cancel</button></div>`;
    d.onclick = (e) => { if (e.target.closest('[data-ok]')) { d.remove(); res(true); } else if (e.target.closest('[data-no]') || e.target === d) { d.remove(); res(false); } };
    document.body.appendChild(d);
  });
}
applyZoom();
render();
listen();
watchNow(true);
</script>
</body>
</html>
